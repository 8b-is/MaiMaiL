[server]
bind = "0.0.0.0:8088"
mode = "development"
default_backend = "http://127.0.0.1:8080"
log_level = "info"
request_timeout_secs = 30
trust_x_forwarded_host = true

[[tenants]]
id = "demo"
domain = "demo.localhost"
backend = "http://127.0.0.1:8080"

[tenants.branding]
display_name = "Demo Tenant"
primary_color = "#2563eb"

[tenants.routes]
"/json_api.php" = "http://127.0.0.1:8080"
